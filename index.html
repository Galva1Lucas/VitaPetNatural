        .vsl-player {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            max-height: 600px;

            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);

        /* CTA */
        .cta-wrapper {
            padding: 0 1.5rem 2.5rem 1.5rem;
            text-align: center;

            /* Começa escondido */
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.6s ease, max-height 0.6s ease;
        }

        .cta-wrapper.show {
            opacity: 1;
            max-height: 300px;
            margin-top: 1.5rem;
        }

        .cta-button {
            width: 100%;
            max-width: 560px;
            padding: 1.25rem;
            background: #00a86b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 19px;
            font-weight: 700;
            cursor: pointer;
            margin: 0 auto 0.8rem auto;
            display: block;
            transition: background 0.3s, transform 0.2s;
            animation: ctaPulse 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .cta-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }

        .cta-button:active::after {
            width: 300px;
            height: 300px;
        }

        @keyframes ctaPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(0, 168, 107, 0.5), 0 4px 15px rgba(0, 168, 107, 0.3);
                transform: scale(1);
            }
            50% {

<body>

    <div class="container">

    </div>

    <script>
        // Exibe o botão de CTA após 1 minuto e 40 segundos (100s) do vídeo
        var TEMPO_LIBERACAO = 100; // segundos
        var ctaExibido = false;
        var ctaWrapper = document.getElementById('ctaWrapper');

        function exibirCta() {
            if (!ctaExibido) {
                ctaExibido = true;
                ctaWrapper.classList.add('show');
            }
        }

        // Tenta usar a API do player Wistia para saber o tempo do vídeo
        window._wq = window._wq || [];
        window._wq.push({ id: "lvl4lrnvtx", onReady: function(video) {
            video.bind("timechange", function(time) {
                if (time >= TEMPO_LIBERACAO) {
                    exibirCta();
                }
            });
        }});

        // Fallback: se em 110s o player não tiver disparado, libera por garantia
        setTimeout(exibirCta, (TEMPO_LIBERACAO + 10) * 1000);
    </script>
    <!-- PROTEÇÃO CONTRA INSPEÇÃO -->
    <script>
    // Bloquear F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, Ctrl+U, Ctrl+S, Ctrl+C/V/X/A
    document.addEventListener('keydown', function(e){
      if(e.key === 'F12'){ e.preventDefault(); return false; }
      if(e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())){
        e.preventDefault(); return false;
      }
      if(e.ctrlKey && ['u','s','c','v','x','a'].includes(e.key.toLowerCase())){
        e.preventDefault(); return false;
      }
    });

    // Bloquear clique direito
    document.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; });

    // Bloquear copiar / colar / recortar / arrastar
    document.addEventListener('copy', function(e){ e.preventDefault(); });
    document.addEventListener('paste', function(e){ e.preventDefault(); });
    document.addEventListener('cut', function(e){ e.preventDefault(); });
    document.addEventListener('dragstart', function(e){ e.preventDefault(); });

    // Detectar devtools abertos (por redimensionamento da janela)
    (function(){
      var limite = 160;
      setInterval(function(){
        var aberto = window.outerWidth - window.innerWidth > limite ||
                     window.outerHeight - window.innerHeight > limite;
        if(aberto){
          document.body.innerHTML = '<div style="height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-family:sans-serif;font-size:22px;text-align:center;padding:20px;">Acesso bloqueado</div>';
        }
      }, 500);
    })();
    </script>
